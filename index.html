<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>하늘 활공 · 1단계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f2dace;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{font-family:'Gowun Dodum',system-ui,sans-serif;color:#fff}
  #app,canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .layer{position:fixed;inset:0;pointer-events:none}
  #vignette{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(45,25,50,.32) 100%)}
  #cloudfog{background:radial-gradient(ellipse at center,rgba(255,246,238,.9) 0%,rgba(250,236,228,.97) 70%);opacity:0}
  #white{background:#fbf1ea;opacity:0}
  #flash{background:#fff;opacity:0}
  #hud{position:fixed;top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));display:flex;gap:10px;pointer-events:none;
    opacity:0;transition:opacity 1.2s}
  body.flying #hud{opacity:1}
  .stat{background:rgba(40,30,60,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);
    border-radius:12px;padding:6px 11px;display:flex;align-items:baseline;gap:5px;text-shadow:0 1px 3px rgba(0,0,0,.25)}
  .lbl{font-size:11px;opacity:.8}
  .stat b{font-size:19px;font-weight:400;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
  .unit{font-size:11px;opacity:.75}
  .vario.up b{color:#fff} .vario.down b{color:#cfe2ff} .vario.thermal b{color:#ffe08a}
  .vario.thermal{border-color:rgba(255,224,138,.7);box-shadow:0 0 14px rgba(255,200,110,.45)}
  #msg{position:fixed;left:50%;top:22%;transform:translate(-50%,8px);font-size:17px;padding:9px 18px;border-radius:999px;
    background:rgba(40,30,60,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:.6s;pointer-events:none;white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.25);max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #msg.on{opacity:1;transform:translate(-50%,0)}
  #hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:14px;opacity:0;transition:opacity 1.5s;
    background:rgba(40,30,60,.22);padding:8px 16px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap;max-width:94vw;text-align:center}
  #hint.on{opacity:.95}
  @media (max-width:560px){
    #hud{gap:6px} .stat{padding:5px 9px;gap:4px} .stat b{font-size:16px} .lbl{display:none}
  }
  body.touch .k-desk, body.desk .k-touch, body.desk .k-tilt, body:not(.tilt) .k-tilt, body.tilt .k-touch{display:none}
  #joy{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.08);opacity:0;transition:opacity .2s;pointer-events:none}
  #joy.on{opacity:1}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
  #fs{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;border-radius:12px;
    border:1px solid rgba(255,255,255,.3);background:rgba(40,30,60,.22);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
    background:linear-gradient(180deg,rgba(40,50,100,.25),rgba(0,0,0,0) 45%,rgba(60,30,50,.25));transition:opacity 1.2s;padding:24px}
  #title.off{opacity:0;pointer-events:none}
  .modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .modes .go{padding:12px 24px;display:inline-flex;align-items:center;gap:9px}
  .ph{display:inline-block;border:2px solid currentColor;border-radius:3px}
  .ph.p{width:10px;height:17px} .ph.l{width:17px;height:10px}
  #rotate{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;padding:14px 22px;border-radius:16px;background:rgba(40,30,60,.55);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
  #rotate.on{opacity:1}
  #title h1{margin:0;font-weight:400;font-size:clamp(40px,9vw,76px);letter-spacing:.06em;text-shadow:0 2px 24px rgba(120,60,40,.45)}
  #title .sub{font-size:13px;letter-spacing:.3em;opacity:.85}
  #title .ctl{font-size:14px;line-height:1.9;opacity:.92;background:rgba(40,30,60,.2);padding:10px 18px;border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .go{margin-top:6px;font:inherit;font-size:18px;color:#5a3a3a;background:rgba(255,248,240,.92);border:0;border-radius:999px;padding:12px 38px;cursor:pointer;
    box-shadow:0 6px 24px rgba(120,60,40,.3);animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  kbd{font-family:inherit;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="cloudfog" class="layer"></div>
<div id="vignette" class="layer"></div>
<div id="flash" class="layer"></div>
<div id="hud">
  <div class="stat"><span class="lbl">고도</span><b id="alt">0</b><span class="unit">m</span></div>
  <div class="stat"><span class="lbl">속도</span><b id="spd">0</b><span class="unit">km/h</span></div>
  <div class="stat vario" id="variobox"><b id="vario">0.0</b><span class="unit">m/s</span></div>
</div>
<div id="msg"></div>
<div id="hint">
  <span class="k-desk"><kbd>A</kbd><kbd>D</kbd> 방향 · <kbd>W</kbd> 빨라짐 · <kbd>S</kbd> 느려짐 · 드래그로 둘러보기</span>
  <span class="k-touch">왼쪽 드래그: 비행 · 오른쪽 드래그: 둘러보기</span>
  <span class="k-tilt">좌우로 기울여 방향 · 앞뒤로 기울여 속도 · 두 번 탭: 수평 맞추기</span>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="fs" aria-label="전체 화면">⛶</button>
<div id="white" class="layer"></div>
<div id="rotate"></div>
<div id="title">
  <div class="sub">HANG GLIDER · 1단계</div>
  <h1>하늘 활공</h1>
  <div class="ctl">
    <div class="k-desk"><kbd>A</kbd> <kbd>D</kbd> 또는 <kbd>←</kbd> <kbd>→</kbd> 몸을 기울여 방향 바꾸기<br><kbd>W</kbd> 앞으로 숙이기 (빨라짐) · <kbd>S</kbd> 뒤로 버티기 (느려짐)<br>마우스 드래그로 경치 둘러보기</div>
    <div class="k-touch">폰을 핸들처럼 좌우로 기울이면 방향<br>앞으로 숙이면 빨라지고, 뒤로 젖히면 느려져요<br>두 번 탭: 수평 맞추기 · 오른쪽 드래그: 둘러보기</div>
  </div>
  <button id="startBtn" class="go k-desk">출발</button>
  <div class="modes k-touch">
    <button class="go modeBtn" data-mode="portrait"><i class="ph p"></i>세로 모드</button>
    <button class="go modeBtn" data-mode="landscape"><i class="ph l"></i>가로 모드</button>
  </div>
</div>
